<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b101d" />
    <title>Pelican Campus Quest — Open-World GTA 3D</title>
    <meta
      name="description"
      content="Open-world HDR PlayCanvas 3D car & character game across Mountain View Campus and Tashkent TV Tower Plaza."
    />
    <meta property="og:title" content="Pelican Campus Quest — Open-World GTA 3D" />
    <meta
      property="og:description"
      content="Drive custom GLB cars with spinning/steering wheels and editable Uzbekistan license plates, or explore on foot."
    />
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <!-- Minimal Fullscreen Preloader -->
    <div id="preloader" class="preloader">
      <div class="preloader-card">
        <div class="preloader-title">PELICAN CAMPUS · TASHKENT PLAZA</div>
        <div id="preloader-status" class="preloader-status">Initializing HDR 3D Engine…</div>
        <div class="preloader-bar"><div id="preloader-fill" class="preloader-fill"></div></div>
      </div>
    </div>

    <!-- WebGL Context Recovery Banner -->
    <div id="context-lost" class="context-lost hidden">
      <div class="context-card">
        <div class="context-title">Graphics Context Interrupted</div>
        <button id="btn-reload-gl" type="button" class="glass-btn accent">Reload</button>
      </div>
    </div>

    <!-- Ultra-Clean Transparent GTA HUD -->
    <div id="hud" class="hud">
      <!-- Top Bar (Minimal, Transparent Glass) -->
      <div class="hud-top">
        <div class="hud-left-cluster">
          <div class="hud-glass-chip">
            <span id="hud-mode-dot" class="mode-dot"></span>
            <span id="hud-car-name" class="hud-title-text">Cobalt</span>
            <span class="hud-sep">·</span>
            <span id="hud-checkpoints" class="hud-sub-text">0/12</span>
          </div>
        </div>

        <div class="hud-right-cluster">
          <button id="btn-garage" type="button" class="glass-btn accent" title="Garage, Plates & Models">
            <svg viewBox="0 0 24 24" class="ico" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 17h14M6 12l1.5-5h9L18 12M4 12h16v5H4z" />
              <circle cx="7.5" cy="17" r="1.5" />
              <circle cx="16.5" cy="17" r="1.5" />
            </svg>
            <span>Garage</span>
          </button>
          <button id="btn-plate-quick" type="button" class="glass-btn" title="Edit License Plate">
            <span class="plate-mini-tag">UZ</span>
            <span id="hud-plate-short">01 A777AA</span>
          </button>
          <button id="btn-camera" type="button" class="glass-btn" title="Camera (C)">Chase</button>
          <button id="btn-time" type="button" class="glass-btn" title="Time of Day">Day</button>
          <button id="btn-sound" type="button" class="glass-btn icon-only" title="Audio">
            <svg id="ico-sound" viewBox="0 0 24 24" class="ico" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 5L6 9H2v6h4l5 4V5z" />
              <path d="M15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14" />
            </svg>
          </button>
          <button id="btn-reset" type="button" class="glass-btn icon-only" title="Reset (R)">
            <svg viewBox="0 0 24 24" class="ico" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Bottom Transparent Controls Overlay -->
      <div class="hud-bottom">
        <!-- LEFT SIDE: Driving Steering OR On-Foot Virtual Joystick -->
        <div class="controls-left">
          <!-- Car Mode Steer Arrows (Transparent Real-Game Glass) -->
          <div id="car-steer-pad" class="steer-pad">
            <button id="touch-left" type="button" class="gt-btn gt-steer" aria-label="Steer Left">
              <svg viewBox="0 0 24 24" class="ico-lg" fill="none" stroke="currentColor" stroke-width="2.4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6" />
              </svg>
            </button>
            <button id="touch-right" type="button" class="gt-btn gt-steer" aria-label="Steer Right">
              <svg viewBox="0 0 24 24" class="ico-lg" fill="none" stroke="currentColor" stroke-width="2.4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6" />
              </svg>
            </button>
          </div>

          <!-- On-Foot Mode Analog Thumbstick (Transparent Ring) -->
          <div id="foot-joy-base" class="joy-base hidden" aria-label="Move Character">
            <div class="joy-cross"></div>
            <div id="foot-joy-knob" class="joy-knob"></div>
          </div>
        </div>

        <!-- CENTER-BOTTOM: Minimal Floating Digital Speedometer -->
        <div id="speed-cluster" class="speed-cluster">
          <div class="speed-main">
            <span id="speed-val" class="speed-val">0</span>
            <span class="speed-meta">
              <span id="speed-gear" class="speed-gear">P</span>
              <span class="speed-unit">KM/H</span>
            </span>
          </div>
          <div class="meter-bars">
            <div class="meter-track"><div id="rpm-fill" class="meter-fill rpm"></div></div>
            <div class="meter-track"><div id="nitro-fill" class="meter-fill nitro"></div></div>
          </div>
        </div>

        <!-- RIGHT SIDE: Transparent Pedals / Action Buttons -->
        <div class="controls-right">
          <!-- Always-accessible GTA Enter / Exit Car button -->
          <div class="action-arc">
            <button id="btn-enter-exit" type="button" class="gt-btn gt-circle gt-door" title="Enter / Exit Car (F)">
              <svg viewBox="0 0 24 24" class="ico-md" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 15v2a1 1 0 001 1h14a1 1 0 001-1v-2M5 15l1.5-5.5A2 2 0 018.4 8h7.2a2 2 0 011.9 1.5L19 15" />
                <circle cx="7.5" cy="18" r="1.2" />
                <circle cx="16.5" cy="18" r="1.2" />
              </svg>
              <span id="enter-exit-label" class="gt-sub">EXIT</span>
            </button>

            <button id="touch-horn" type="button" class="gt-btn gt-circle car-only" aria-label="Horn">
              <svg viewBox="0 0 24 24" class="ico-md" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" />
              </svg>
              <span class="gt-sub">HORN</span>
            </button>

            <button id="touch-drift" type="button" class="gt-btn gt-circle car-only" aria-label="Drift">
              <span class="gt-cap">DRIFT</span>
            </button>

            <button id="touch-nitro" type="button" class="gt-btn gt-circle gt-nitro car-only" aria-label="Nitro">
              <span class="gt-cap">NOS</span>
            </button>

            <button id="touch-sprint" type="button" class="gt-btn gt-circle gt-nitro foot-only hidden" aria-label="Sprint">
              <span class="gt-cap">RUN</span>
            </button>
          </div>

          <!-- Transparent Racing Pedals (Car Mode Only) -->
          <div id="car-pedals" class="pedal-pair car-only">
            <button id="touch-brake" type="button" class="gt-btn gt-pedal gt-brake" aria-label="Brake / Reverse">
              <span class="pedal-ribs"></span>
              <span class="pedal-lbl">BRAKE</span>
            </button>
            <button id="touch-gas" type="button" class="gt-btn gt-pedal gt-gas" aria-label="Gas">
              <span class="pedal-ribs"></span>
              <span class="pedal-lbl">GAS</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Translucent Garage · License Plate · World Models Drawer -->
    <div id="garage-backdrop" class="drawer-backdrop hidden">
      <div class="drawer-panel">
        <div class="drawer-header">
          <div class="drawer-tabs">
            <button type="button" class="tab-btn active" data-tab="cars">Cars</button>
            <button type="button" class="tab-btn" data-tab="plate">UZ Nomer</button>
            <button type="button" class="tab-btn" data-tab="world">Character &amp; Tower</button>
          </div>
          <button id="garage-close" type="button" class="close-btn" aria-label="Close">✕</button>
        </div>

        <!-- TAB 1: Cars -->
        <div id="tab-cars" class="tab-pane">
          <div id="garage-list" class="garage-list"></div>
          <div class="drawer-footer">
            <button id="btn-import-glb" type="button" class="full-glass-btn accent">+ Load local .glb car</button>
            <input id="file-input-glb" type="file" accept=".glb,.gltf" class="hidden" />
          </div>
        </div>

        <!-- TAB 2: Crisp Uzbekistan License Plate Editor -->
        <div id="tab-plate" class="tab-pane hidden">
          <div class="plate-preview-wrap">
            <div id="plate-preview" class="uz-plate-live style-white">
              <div id="plate-prev-region" class="uz-region">01</div>
              <div id="plate-prev-text" class="uz-main">A 777 AA</div>
              <div class="uz-flag-col">
                <div class="uz-flag"></div>
                <div class="uz-code">UZ</div>
              </div>
            </div>
          </div>

          <div class="plate-form">
            <div class="plate-row-2">
              <label class="field-box">
                <span>Hudud (Region)</span>
                <input id="plate-region" type="text" maxlength="2" value="01" placeholder="01" />
              </label>
              <label class="field-box flex-grow">
                <span>Raqam (Plate Text)</span>
                <input id="plate-text" type="text" maxlength="10" value="A 777 AA" placeholder="A 777 AA" />
              </label>
            </div>

            <div class="plate-style-row">
              <button type="button" class="style-pill active" data-plate-style="white">White UZ</button>
              <button type="button" class="style-pill" data-plate-style="vip">VIP Black</button>
              <button type="button" class="style-pill" data-plate-style="taxi">Yellow</button>
              <label class="toggle-chip">
                <input id="plate-enabled" type="checkbox" checked />
                <span>Show</span>
              </label>
            </div>

            <div class="slider-grid">
              <label class="slider-row">
                <span>Front Y <b id="val-front-y">0.42</b></span>
                <input id="plate-front-y" type="range" min="0.15" max="1.25" step="0.01" value="0.42" />
              </label>
              <label class="slider-row">
                <span>Front Z <b id="val-front-z">-2.24</b></span>
                <input id="plate-front-z" type="range" min="-3.0" max="-1.2" step="0.01" value="-2.24" />
              </label>
              <label class="slider-row">
                <span>Rear Y <b id="val-rear-y">0.72</b></span>
                <input id="plate-rear-y" type="range" min="0.15" max="1.35" step="0.01" value="0.72" />
              </label>
              <label class="slider-row">
                <span>Rear Z <b id="val-rear-z">2.24</b></span>
                <input id="plate-rear-z" type="range" min="1.2" max="3.0" step="0.01" value="2.24" />
              </label>
              <label class="slider-row">
                <span>Scale <b id="val-plate-scale">100%</b></span>
                <input id="plate-scale" type="range" min="0.6" max="1.5" step="0.02" value="1.0" />
              </label>
            </div>
          </div>
        </div>

        <!-- TAB 3: Character (character.glb) & Tashkent TV Tower (tashkent.glb) -->
        <div id="tab-world" class="tab-pane hidden">
          <div class="world-card">
            <div class="world-card-title">Playable Character (models/character.glb)</div>
            <div id="char-status" class="world-card-sub">Default Articulated Character</div>
            <div class="world-card-actions">
              <button id="btn-walk-mode" type="button" class="car-mini-btn drive">Walk On Foot</button>
              <button id="btn-flip-char" type="button" class="car-mini-btn">Flip 180°</button>
              <button id="btn-import-char" type="button" class="car-mini-btn">+ Load character.glb</button>
            </div>
            <input id="file-input-char" type="file" accept=".glb,.gltf" class="hidden" />
          </div>

          <div class="world-card">
            <div class="world-card-title">Tashkent TV Tower (models/tashkent.glb)</div>
            <div id="tashkent-status" class="world-card-sub">Architectural Tower · Central Plaza (0, 29)</div>
            <div class="world-card-actions">
              <button id="btn-import-tashkent" type="button" class="car-mini-btn drive">+ Load tashkent.glb</button>
            </div>
            <input id="file-input-tashkent" type="file" accept=".glb,.gltf" class="hidden" />
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
